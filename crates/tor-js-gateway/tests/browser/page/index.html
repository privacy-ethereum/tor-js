<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>tor-js-gateway browser smoke test</title>
  <!-- Resolve the bare package specifiers to the dist trees the static server
       exposes (see global-setup.js STATIC_ROUTES). Avoids a bundler. -->
  <script type="importmap">
  {
    "imports": {
      "@kpstreams/core": "/kps/core/index.js",
      "@kpstreams/core/webrtc": "/kps/core/webrtc.js",
      "@kpstreams/webrtc-client": "/kps/webrtc-client/index.js"
    }
  }
  </script>
</head>
<body>
  <pre id="status">idle</pre>
  <pre id="result"></pre>
  <script type="module">
    import { dial } from '@kpstreams/webrtc-client'

    const statusEl = document.getElementById('status')
    const resultEl = document.getElementById('result')
    const setStatus = s => { statusEl.textContent = s }

    // One KPS-HTTP/1 exchange (PROTOCOL.md §3): write the request, FIN, read
    // the response to EOF. Returns the parsed /metadata.json document.
    window.fetchMetadata = async function (addr) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('connected')
      const stream = await conn.openStream()

      const writer = stream.writable.getWriter()
      await writer.write(new TextEncoder().encode(
        'GET /metadata.json HTTP/1.1\r\nHost: x\r\n\r\n'))
      await writer.close()

      const reader = stream.readable.getReader()
      const chunks = []
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        if (value) chunks.push(value)
      }
      const total = chunks.reduce((n, c) => n + c.length, 0)
      const merged = new Uint8Array(total)
      let off = 0
      for (const c of chunks) { merged.set(c, off); off += c.length }
      const text = new TextDecoder().decode(merged)

      const [head, body] = text.split('\r\n\r\n')
      const status = parseInt(head.split(' ')[1], 10)
      const meta = JSON.parse(body)
      resultEl.textContent = JSON.stringify(meta)
      setStatus('done')
      await conn.close()
      return { status, meta }
    }

    // --- shared helpers ---------------------------------------------------

    const concat = chunks => {
      const total = chunks.reduce((n, c) => n + c.length, 0)
      const out = new Uint8Array(total)
      let off = 0
      for (const c of chunks) { out.set(c, off); off += c.length }
      return out
    }

    const findHeadEnd = buf => {
      for (let i = 0; i + 3 < buf.length; i++) {
        if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) return i
      }
      return -1
    }

    const sha256Hex = async bytes => {
      const digest = await crypto.subtle.digest('SHA-256', bytes)
      return [...new Uint8Array(digest)]
        .map(b => b.toString(16).padStart(2, '0')).join('')
    }

    /// One KPS-HTTP/1 GET on its own stream, read to EOF.
    async function getBytes(conn, path) {
      const stream = await conn.openStream()
      const writer = stream.writable.getWriter()
      await writer.write(new TextEncoder().encode(
        `GET ${path} HTTP/1.1\r\nHost: x\r\n\r\n`))
      await writer.close()
      const reader = stream.readable.getReader()
      const chunks = []
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        if (value) chunks.push(value)
      }
      const buf = concat(chunks)
      const sep = findHeadEnd(buf)
      const head = new TextDecoder().decode(buf.subarray(0, sep))
      return {
        status: parseInt(head.split(' ')[1], 10),
        headers: head,
        body: buf.subarray(sep + 4),
      }
    }

    /// CONNECT a tunnel and return the reply plus the stream primitives, with
    /// any tunnel bytes that arrived alongside the head.
    async function openTunnel(conn, target) {
      const stream = await conn.openStream()
      const writer = stream.writable.getWriter()
      const reader = stream.readable.getReader()
      await writer.write(new TextEncoder().encode(
        `CONNECT ${target} HTTP/1.1\r\nHost: ${target}\r\n\r\n`))
      let buf = new Uint8Array(0)
      for (;;) {
        const sep = findHeadEnd(buf)
        if (sep !== -1) {
          const head = new TextDecoder().decode(buf.subarray(0, sep))
          return {
            status: parseInt(head.split(' ')[1], 10),
            extra: buf.subarray(sep + 4),
            reader,
            writer,
            stream,
          }
        }
        const { value, done } = await reader.read()
        if (done) throw new Error('stream ended before the CONNECT reply')
        buf = concat([buf, value])
      }
    }

    // --- data-path tests --------------------------------------------------

    /// Downloads the bootstrap archive over WebRTC and hashes it, so a
    /// data-channel chunking or reassembly fault shows up as a mismatch rather
    /// than a silent corruption.
    window.downloadBootstrap = async function (addr) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('downloading')
      const res = await getBytes(conn, '/bootstrap.zip.zst')
      const sha256 = await sha256Hex(res.body)
      await conn.close()
      setStatus('done')
      return { status: res.status, length: res.body.length, sha256 }
    }

    /// Echoes `size` bytes through a CONNECT tunnel and reports whether they
    /// came back byte-identical, plus whether the half-close mapped to EOF.
    window.tunnelEcho = async function (addr, target, size) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('tunneling')
      const t = await openTunnel(conn, target)
      if (t.status !== 200) {
        await conn.close()
        return { status: t.status }
      }

      const payload = new Uint8Array(size)
      for (let i = 0; i < size; i++) payload[i] = i & 0xff
      await t.writer.write(payload)

      const chunks = t.extra.length ? [t.extra] : []
      let got = t.extra.length
      while (got < size) {
        const { value, done } = await t.reader.read()
        if (done) break
        if (value) { chunks.push(value); got += value.length }
      }
      const echoed = concat(chunks)

      // Client FIN → target FIN → echo closes → server FINs back (§4).
      await t.writer.close()
      const { done } = await t.reader.read()

      await conn.close()
      setStatus('done')
      return {
        status: 200,
        length: echoed.length,
        matches: echoed.length === size && echoed.every((b, i) => b === payload[i]),
        sawEof: done === true,
      }
    }

    /// Several streams on ONE connection: metadata, a bootstrap download and two
    /// tunnels. Guards the reused-stream-id regression (kps#4), which hung reads
    /// after roughly two streams per WebRTC connection.
    window.multiStream = async function (addr, target) {
      setStatus('dialing')
      const conn = await dial(addr)
      const results = []

      const meta = await getBytes(conn, '/metadata.json')
      results.push({ what: 'metadata', status: meta.status })

      const boot = await getBytes(conn, '/bootstrap.zip.zst')
      results.push({ what: 'bootstrap', status: boot.status, length: boot.body.length })

      for (const i of [1, 2]) {
        const t = await openTunnel(conn, target)
        const payload = new TextEncoder().encode(`tunnel ${i}`)
        await t.writer.write(payload)
        let echoed = t.extra
        while (echoed.length < payload.length) {
          const { value, done } = await t.reader.read()
          if (done) break
          if (value) echoed = concat([echoed, value])
        }
        await t.writer.close()
        await t.reader.read()
        results.push({
          what: `tunnel${i}`,
          status: t.status,
          text: new TextDecoder().decode(echoed),
        })
      }

      const after = await getBytes(conn, '/metadata.json')
      results.push({ what: 'metadata-again', status: after.status })

      await conn.close()
      setStatus('done')
      return results
    }
  </script>
</body>
</html>
