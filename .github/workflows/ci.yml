name: CI

on:
  push:
    branches: [main, kps]
  pull_request:
  workflow_dispatch:

# Minimal by default; the Pages deploy job elevates its own permissions.
permissions:
  contents: read

jobs:
  # Native gateway crate: build, Rust tests, and the KPS transport tests
  # (QUIC via @kpstreams/quic-client, WebRTC via @kpstreams/webrtc-client).
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo build`/`test` operate on default-members (the gateway); the
      # binary lands in the workspace target/, where the JS harnesses look.
      - name: Build gateway
        run: cargo build --locked
      - name: Rust unit tests
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integration tests (KPS/QUIC)
        working-directory: crates/tor-js-gateway/tests/integration
        run: |
          npm ci
          npm test

      - name: Browser smoke test (KPS/WebRTC)
        working-directory: crates/tor-js-gateway/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  # WASM client crate + TypeScript wrapper, and assembly of the showcase site.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build WASM + TS wrapper
        run: npm run build

      # Gateway selection (shuffle, least-outstanding, cooldown, deadlines,
      # bootstrap failover) against a fake KPS dialer — no network.
      - name: Unit tests
        run: npm run test:unit

      # anon-rpc worker (dist/anon-rpc-worker.js is produced by the build above):
      # assert the shipped bundle is clean, then run the offline harness test.
      # The real Tor fetch (test:e2e) is intentionally NOT in CI — it needs live
      # Tor egress and can't be hermetic; CI stays network-free like the rest.
      - name: anon-rpc worker — bundle assertions
        run: |
          f=dist/anon-rpc-worker.js
          test -f "$f"
          grep -q wasmBase64 "$f"                                    # WASM embedded
          ! grep -qiE "createDataChannel|node_modules/@kpstreams" "$f"  # no KPS client code
          ! grep -q "170.64.236.147" "$f"                            # no baked demo gateway
          echo "worker bundle OK ($(du -h "$f" | cut -f1); no KPS client code; no baked gateway)"
      - name: anon-rpc worker — hermetic harness test (offline)
        working-directory: test/anon-rpc-worker
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:hermetic

      # The website consumes tor-js via a file:.. link, so the package dist
      # above must exist first.
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: cp -a website/dist _site
      - uses: actions/upload-pages-artifact@v3

  # Deploy the website to GitHub Pages — main only.
  deploy-site:
    needs: client
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
